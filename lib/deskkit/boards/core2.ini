; M5Stack Core2: ESP32, 320x240 touch screen, speaker, 16MB flash, 8MB PSRAM,
; CH9102 USB-serial bridge. An app's environments extend these sections.

[core2]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
lib_deps = ${deskkit.lib_deps}
monitor_speed = 115200

; The Core2 in the desktop simulator, at twice its size
[core2_simulator]
extends = deskkit_desktop
build_flags =
  ${deskkit_desktop.build_flags}
  -DM5GFX_BOARD=board_M5StackCore2
  -DM5GFX_SCALE=2
