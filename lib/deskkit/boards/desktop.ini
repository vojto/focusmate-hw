; What every deskkit app builds with, and the desktop simulator: the app in a
; window on a Mac, through M5GFX's SDL panel, with its real data. A device's
; simulator section (like core2_simulator in core2.ini) adds which board it
; draws. Needs `brew install sdl2`.

[deskkit]
lib_deps =
  m5stack/M5Unified
  bblanchon/ArduinoJson@^7

[deskkit_desktop]
platform = native
lib_deps = ${deskkit.lib_deps}
build_flags =
  -std=gnu++17
  ; Stands in for the Arduino core, which the desktop doesn't have
  -Ilib/deskkit/desktop
  -I/opt/homebrew/include/SDL2
  -L/opt/homebrew/lib
  -lSDL2
  -lcurl
