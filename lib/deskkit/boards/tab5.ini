; M5Stack Tab5: ESP32-P4, 5" 1280x720 touch screen (a portrait panel, which
; begin() turns sideways), ESP32-C6 for Wi-Fi over SDIO, speaker, 16MB flash,
; 32MB PSRAM, native USB. An app's environments extend these sections.

; The ESP32-P4 needs Arduino 3, which PlatformIO's own espressif32 platform
; doesn't have; pioarduino's does, with a board for the Tab5 that also knows
; the Wi-Fi chip's pins. The board is for the early chips (before revision
; 3.0); a Tab5 with a newer one needs board = esp32-p4_r3 instead.
[tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
; The board names this table, but the build uses the 1.25MB default unless it's set here
board_build.partitions = default_16MB.csv
lib_deps = ${deskkit.lib_deps}
monitor_speed = 115200

; The Tab5 in the desktop simulator, at its real size
[tab5_simulator]
extends = deskkit_desktop
build_flags =
  ${deskkit_desktop.build_flags}
  -DM5GFX_BOARD=board_M5Tab5
