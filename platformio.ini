[platformio]
default_envs = core2

; M5Stack Core2 (ESP32, 16MB flash, 8MB PSRAM, CH9102 USB-serial bridge)
[env:core2]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
lib_deps =
  m5stack/M5Unified
  bblanchon/ArduinoJson@^7
monitor_speed = 115200

; Same firmware plus src/debug.h: fake sessions and screenshots over serial.
; Flash with: pio run -e debug -t upload
[env:debug]
extends = env:core2
build_flags = -DDEBUG_TOOLS

; The same firmware in a window on the Mac, with real data and the debug
; commands on stdin. Needs `brew install sdl2`. Build and start with:
; pio run -e native && .pio/build/native/program
[env:native]
platform = native
lib_deps = ${env:core2.lib_deps}
build_flags =
  -std=gnu++17
  -DDEBUG_TOOLS
  -DM5GFX_BOARD=board_M5StackCore2
  -DM5GFX_SCALE=2
  -Isimulator
  -I/opt/homebrew/include/SDL2
  -L/opt/homebrew/lib
  -lSDL2
  -lcurl
; Arduino adds this include to every file by itself
build_src_flags = -include Arduino.h
build_src_filter = +<*> -<network.cpp> -<fetcher.cpp> +<../simulator/>
