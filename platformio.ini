; The devices come from deskkit (lib/deskkit/boards); this file only picks
; them and adds the debug tools where wanted.

[platformio]
default_envs = core2
extra_configs = lib/deskkit/boards/*.ini

[env:core2]
extends = core2

; Same firmware plus the debug commands over serial: fake sessions and
; screenshots. Flash with: pio run -e debug -t upload
[env:debug]
extends = core2
build_flags = -DDEBUG_TOOLS

; The firmware in a window on the Mac, with real data and the debug commands
; on stdin. Build and start with: pio run -e simulator && .pio/build/simulator/program
[env:simulator]
extends = core2_simulator
build_flags =
  ${core2_simulator.build_flags}
  -DDEBUG_TOOLS
