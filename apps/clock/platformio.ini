; The devices come from deskkit (lib/deskkit/boards at the repo's root); this
; file only picks them and adds the debug tools where wanted.

[platformio]
default_envs = tab5
lib_dir = ../../lib
extra_configs = ../../lib/deskkit/boards/*.ini

[env:tab5]
extends = tab5

; Same firmware plus the debug commands over USB serial, like screenshots.
; Flash with: pio run -e debug -t upload
[env:debug]
extends = tab5
build_flags = -DDEBUG_TOOLS

; The app in a window on the Mac. Build and start with:
; pio run -e simulator && .pio/build/simulator/program
[env:simulator]
extends = tab5_simulator
build_flags =
  ${tab5_simulator.build_flags}
  -DDEBUG_TOOLS
