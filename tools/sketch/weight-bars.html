<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Bars Sketch</title>
<!--
  The weight slide as a horizontal bar chart, on a drawing of the Core2:
  today's weigh-in, this week's average, then the six weeks before. Real
  numbers come from tools/out/weight-data.js, made by tools/weight_data.py and
  gitignored; without it the sketch uses made-up weights.
-->
<style>
  :root { --bg: #f4f3ef; --muted: #6b6a64; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --muted: #9a998f; }
  }
  :root[data-theme="dark"] { --bg: #161615; --muted: #9a998f; }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); font: 12px/1.4 -apple-system, system-ui, sans-serif;
         display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px 16px; }
  .variations { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; }
  figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
  figcaption { color: var(--muted); font-size: 13px; }

  /* The Core2 is about 54x54mm; its 2" screen is 40.8x30.6mm (4:3), centered near the top */
  .device { --mm: min(12px, calc((100vw - 32px) / 54), calc((50vw - 48px) / 54)); width: calc(54 * var(--mm)); height: calc(54 * var(--mm));
            border-radius: calc(4 * var(--mm)); background: linear-gradient(160deg, #3a3a3c, #232325);
            box-shadow: 0 calc(2 * var(--mm)) calc(5 * var(--mm)) rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .12);
            position: relative; }
  .glass { position: absolute; left: calc(4 * var(--mm)); right: calc(4 * var(--mm)); top: calc(4 * var(--mm));
           height: calc(40 * var(--mm)); background: #0b0b0c; border-radius: calc(1.5 * var(--mm));
           box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
  .screen { position: absolute; left: calc(2.6 * var(--mm)); top: calc(2.4 * var(--mm));
            width: calc(40.8 * var(--mm)); height: calc(30.6 * var(--mm)); background: #000; }
  .screen svg { width: 100%; height: 100%; display: block; }
  /* The three touch buttons under the screen, at a third of its width each */
  .buttons { position: absolute; left: calc(2.6 * var(--mm)); width: calc(40.8 * var(--mm)); bottom: calc(2.2 * var(--mm));
             display: flex; justify-content: space-around; }
  .buttons span { width: calc(1.6 * var(--mm)); height: calc(1.6 * var(--mm)); border-radius: 50%; background: #c8102e; opacity: .8; }
  /* FreeSans on the device is a Helvetica clone */
  svg text { font-family: Helvetica, Arial, sans-serif; }
  .note { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="variations"></div>
<p class="note" id="source"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="../out/weight-data.js"></script>
<script>
const WIDTH = 320, HEIGHT = 240, PADDING = 12, ROWS = 8, LABEL_WIDTH = 44, BAR_HEIGHT = 22, VALUE_SIZE = 22;
const WHITE = '#F1EFE8', GRAY = '#B4B2A9', BLUE = '#85B7EB', DIM = '#444441', GREEN = '#59DE65', RED = '#FC5855';  // BLUE is SLEEP_BLUE on the dashboard
const CHANGE_WEEKS = 8, CHANGE_SCALE_STEP = 0.5;  // rows, and the widest bar rounded up to this many kilos

const data = typeof WEIGHTS !== 'undefined' ? WEIGHTS : madeUpWeights();
const rows = rowsOf(data);

const VARIATIONS = [
  { title: 'Weight, in half-kilo segments', draw: render },
  { title: 'Change from the week before', draw: renderChange },
];

// Today, this week, then the six weeks before
function rowsOf(weights) {
  const today = weights.current_week.days.find(d => d.date == isoDate(new Date()))?.weight_kg ?? null;
  const weeks = [weights.current_week, ...weights.past_weeks];
  const list = [{ label: 'today', kg: today }, ...weeks.slice(0, ROWS - 1).map(w => ({ label: `W${isoWeek(new Date(`${w.week_start_date}T12:00:00`))}`, kg: w.average_weight_kg }))];
  return list;
}

// Bars start a kilo under the lightest row; from zero they would all look the same
function render(svg) {
  const known = rows.map(r => r.kg).filter(kg => kg != null);
  const valueWidth = measure('109.0', VALUE_SIZE);
  const x0 = PADDING + LABEL_WIDTH;
  const x = d3.scaleLinear().domain([Math.floor(d3.min(known)) - 1, Math.ceil(d3.max(known))]).range([x0, WIDTH - PADDING - 8 - valueWidth]);
  const rowHeight = HEIGHT / ROWS;

  const row = svg.selectAll('g.row').data(rows).join('g').attr('class', 'row').attr('transform', (_, i) => `translate(0, ${i * rowHeight + rowHeight / 2})`);
  row.append('text').attr('x', PADDING).attr('dy', '0.35em').attr('font-size', 13).attr('fill', GRAY).text(d => d.label);
  row.selectAll('rect').data(d => segments(x.domain()[0], d.kg)).join('rect')
    .attr('x', ([from]) => x(from) + 1).attr('y', -BAR_HEIGHT / 2).attr('height', BAR_HEIGHT)
    .attr('width', ([from, to]) => Math.max(x(to) - x(from) - 2, 1)).attr('rx', 3).attr('fill', BLUE);
  row.append('text').attr('x', d => (d.kg == null ? x0 : x(d.kg)) + 8).attr('dy', '0.35em').attr('font-size', VALUE_SIZE).attr('fill', WHITE)
    .text(d => d.kg == null ? '--' : d.kg.toFixed(1));
}

// A bar as [from, to] pieces of half a kilo each, the last one cut at the
// weight rounded to a tenth, so it is never thinner than 100 g
function segments(start, kg) {
  if (kg == null) return [];
  const end = Math.round(kg * 10) / 10;
  return d3.range(start, end - 0.01, 0.5).map(from => [from, Math.min(from + 0.5, end)]);
}

// MARK: Change

// This week and the seven before, each a bar from the middle of the screen:
// left and green for a loss, right and red for a gain
function renderChange(svg) {
  const changes = weeklyChanges();
  const mid = WIDTH / 2, half = mid - PADDING - 36 - 6;
  const widest = Math.max(CHANGE_SCALE_STEP, Math.ceil(d3.max(changes, c => Math.abs(c.kg ?? 0)) / CHANGE_SCALE_STEP) * CHANGE_SCALE_STEP);
  const x = d3.scaleLinear().domain([-widest, widest]).range([mid - half, mid + half]);
  const rowHeight = HEIGHT / CHANGE_WEEKS;

  svg.append('line').attr('x1', mid).attr('x2', mid).attr('y1', 0).attr('y2', HEIGHT).attr('stroke', DIM);
  const row = svg.selectAll('g.change').data(changes).join('g').attr('class', 'change').attr('transform', (_, i) => `translate(0, ${i * rowHeight + rowHeight / 2})`);
  row.append('text').attr('x', PADDING).attr('dy', '0.35em').attr('font-size', 13).attr('fill', GRAY).text(d => d.label);
  row.filter(d => d.kg != null).append('rect').attr('y', -rowHeight / 2 + 3).attr('height', rowHeight - 6).attr('rx', 3)
    .attr('x', d => Math.min(mid, x(d.kg))).attr('width', d => Math.max(Math.abs(x(d.kg) - mid), 2)).attr('fill', d => d.kg <= 0 ? GREEN : RED);
  row.append('text').attr('x', WIDTH - PADDING).attr('dy', '0.35em').attr('text-anchor', 'end').attr('font-size', 13).attr('fill', GRAY)
    .text(d => d.kg == null ? '--' : `${d.kg <= 0 ? '−' : '+'}${Math.abs(d.kg).toFixed(1)}`);
}

// Each week's average against the closest week before it with a weigh-in,
// per week, so a missing week doesn't double the next one's change
function weeklyChanges() {
  const weeks = [data.current_week, ...data.past_weeks];
  return weeks.slice(0, CHANGE_WEEKS).map((week, i) => {
    const before = weeks.findIndex((w, j) => j > i && w.average_weight_kg != null);
    const kg = week.average_weight_kg == null || before < 0 ? null : (week.average_weight_kg - weeks[before].average_weight_kg) / (before - i);
    return { label: `W${isoWeek(new Date(`${week.week_start_date}T12:00:00`))}`, kg };
  });
}

// Width of text in the screen's font, in screen pixels
function measure(text, size) {
  const probe = d3.select('svg').append('text').attr('font-size', size).text(text);
  const width = probe.node().getComputedTextLength();
  probe.remove();
  return width;
}

// MARK: Dates

function isoDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function isoWeek(date) {
  const thursday = new Date(date); thursday.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const firstThursday = new Date(thursday.getFullYear(), 0, 4);
  return 1 + Math.round(((thursday - firstThursday) / 86400000 - 3 + (firstThursday.getDay() + 6) % 7) / 7);
}

// Plausible weights shaped like Foodmark's response, for when tools/out/weight-data.js is missing
function madeUpWeights() {
  const monday = new Date(); monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
  const day = n => isoDate(new Date(monday.getTime() + n * 86400000));
  return {
    current_week: { week_start_date: day(0), average_weight_kg: 107.2, days: [0, 1, 2, 3, 4, 5, 6].map(n => ({ date: day(n), weight_kg: n <= (new Date().getDay() + 6) % 7 ? 107.4 - n * 0.15 : null })) },
    past_weeks: [107.2, 108.1, 107.8, 108.0, 109.6].map((kg, i) => ({ week_start_date: day(-7 * (i + 1)), average_weight_kg: kg })),
  };
}

document.getElementById('source').textContent = typeof WEIGHTS !== 'undefined'
  ? 'Your weigh-ins from Foodmark. Refresh with python3 tools/weight_data.py.'
  : 'Made-up weights: run python3 tools/weight_data.py for real ones.';
VARIATIONS.forEach(variation => {
  const figure = d3.select('.variations').append('figure');
  const glass = figure.append('div').attr('class', 'device').append('div').attr('class', 'glass');
  const svg = glass.append('div').attr('class', 'screen').append('svg').attr('viewBox', `0 0 ${WIDTH} ${HEIGHT}`);
  glass.append('div').attr('class', 'buttons').html('<span></span><span></span><span></span>');
  figure.append('figcaption').text(variation.title);
  variation.draw(svg);
});
</script>
</body>
</html>
